[platformio]
default_envs = m5stack-core

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = huge_app.csv

[env:m5stack-core]
board = m5stack-core-esp32
build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DHAS_BLUETOOTH=1
lib_deps = 
    m5stack/M5Unified@^0.3.0
    earlephilhower/ESP8266Audio@^1.9.9
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.12

[env:m5stack-core2]
board = m5stack-core2
build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DHAS_BLUETOOTH=1
lib_deps = 
    m5stack/M5Unified@^0.3.0
    earlephilhower/ESP8266Audio@^1.9.9
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.12
